<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#f75049" flood-opacity="0.8"/>
    </filter>
  </defs>
  <!-- Background chamfered container -->
  <polygon points="18,6 82,6 94,18 94,82 82,94 18,94 6,82 6,18" fill="#0e0e17" stroke="#f75049" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Tech accents -->
  <line x1="22" y1="14" x2="38" y2="14" stroke="#60f6ff" stroke-width="2"/>
  <line x1="62" y1="86" x2="78" y2="86" stroke="#60f6ff" stroke-width="2"/>
  <line x1="10" y1="50" x2="22" y2="50" stroke="#f75049" stroke-width="2"/>
  <line x1="78" y1="50" x2="90" y2="50" stroke="#f75049" stroke-width="2"/>

  <!-- Cyber Netrunner Horn / Chevron Top -->
